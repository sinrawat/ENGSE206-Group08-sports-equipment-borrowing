<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 2000" font-family="'Segoe UI','Noto Sans Thai',Tahoma,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a4a5a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="2000" fill="#ffffff"/>
  <text x="660" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#0f2a4a">Activity Diagram — กระบวนการจองและยืม–คืนอุปกรณ์หลัก</text>
  <text x="660" y="53" text-anchor="middle" font-size="12.5" fill="#4a5a6a">ครอบคลุม UC-01, UC-02, UC-04, UC-05, UC-06, UC-07 · อ้างอิง docs/06-requirement-models.md</text>

  <!-- lane backgrounds -->
  <rect x="40"  y="75" width="260" height="1900" fill="#f7f9fc"/>
  <rect x="300" y="75" width="260" height="1900" fill="#f4fbfb"/>
  <rect x="560" y="75" width="260" height="1900" fill="#fbf7ef"/>
  <rect x="820" y="75" width="260" height="1900" fill="#f7f2fb"/>
  <g stroke="#c7d0da" stroke-width="1.5">
    <line x1="300" y1="75" x2="300" y2="1975"/>
    <line x1="560" y1="75" x2="560" y2="1975"/>
    <line x1="820" y1="75" x2="820" y2="1975"/>
    <line x1="1080" y1="75" x2="1080" y2="1975"/>
  </g>
  <!-- lane headers -->
  <g font-size="14" font-weight="700" fill="#0f2a4a" text-anchor="middle">
    <rect x="40"  y="75" width="260" height="34" fill="#dfe6ee"/>
    <text x="170" y="97">ผู้ยืม / ชมรม–ผู้จัดกิจกรรม</text>
    <rect x="300" y="75" width="260" height="34" fill="#d3ecec"/>
    <text x="430" y="97">ระบบ</text>
    <rect x="560" y="75" width="260" height="34" fill="#f2e5c8"/>
    <text x="690" y="97">ผู้ดูแลอุปกรณ์</text>
    <rect x="820" y="75" width="260" height="34" fill="#e6d9f0"/>
    <text x="950" y="97">เจ้าหน้าที่ / ผู้บริหาร (ผู้อนุมัติ)</text>
  </g>

  <!-- ============ NODES ============ -->
  <!-- helper coords: L1=170 L2=430 L3=690 L4=950 -->

  <!-- 1. start -->
  <circle cx="170" cy="140" r="16" fill="#0f2a4a"/>
  <text x="170" y="172" text-anchor="middle" font-size="11.5" fill="#0f2a4a">เริ่มต้น</text>

  <line x1="170" y1="156" x2="170" y2="205" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 2. box L1 -->
  <rect x="60" y="205" width="220" height="60" rx="8" fill="#ffffff" stroke="#3a5a8a" stroke-width="1.6"/>
  <text x="170" y="230" text-anchor="middle" font-size="12.5">เลือกอุปกรณ์และระบุ</text>
  <text x="170" y="248" text-anchor="middle" font-size="12.5">ช่วงเวลาที่ต้องการ</text>

  <path d="M280,235 H430 V265" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- 3. box L2 -->
  <rect x="320" y="265" width="220" height="60" rx="8" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.6"/>
  <text x="430" y="290" text-anchor="middle" font-size="12.5">ตรวจสอบสถานะว่าง/</text>
  <text x="430" y="308" text-anchor="middle" font-size="12.5">ถูกจองของอุปกรณ์ (UC-06)</text>

  <line x1="430" y1="325" x2="430" y2="360" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 4. diamond L2: available? -->
  <polygon points="430,360 505,415 430,470 355,415" fill="#fff7e6" stroke="#c9711a" stroke-width="1.6"/>
  <text x="430" y="410" text-anchor="middle" font-size="11.5">อุปกรณ์ว่างในช่วง</text>
  <text x="430" y="424" text-anchor="middle" font-size="11.5">เวลานั้นหรือไม่?</text>

  <!-- no branch -> L3 box -->
  <path d="M505,415 H600" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="545" y="405" font-size="11" fill="#a04a0a">ไม่ว่าง</text>
  <rect x="600" y="385" width="220" height="60" rx="8" fill="#ffffff" stroke="#8a2a2a" stroke-width="1.6"/>
  <text x="710" y="410" text-anchor="middle" font-size="12">แจ้งว่าไม่มีอุปกรณ์ว่าง</text>
  <text x="710" y="428" text-anchor="middle" font-size="12">ให้เลือกช่วงเวลาใหม่</text>
  <line x1="710" y1="445" x2="710" y2="475" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="710" cy="492" r="14" fill="none" stroke="#8a2a2a" stroke-width="2.2"/>
  <circle cx="710" cy="492" r="8" fill="#8a2a2a"/>
  <text x="710" y="518" text-anchor="middle" font-size="11" fill="#5a6a7a">(กลับไปขั้นตอนที่ 1)</text>

  <!-- yes branch continues down -->
  <line x1="430" y1="470" x2="430" y2="530" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="446" y="500" font-size="11" fill="#2a7a2a">ว่าง</text>

  <!-- 5. diamond L2: special equipment? -->
  <polygon points="430,530 510,590 430,650 350,590" fill="#fff7e6" stroke="#c9711a" stroke-width="1.6"/>
  <text x="430" y="580" text-anchor="middle" font-size="11">เป็นอุปกรณ์ประเภทพิเศษ/</text>
  <text x="430" y="594" text-anchor="middle" font-size="11">ราคาสูงหรือไม่? (BR-02)</text>
  <text x="430" y="608" text-anchor="middle" font-size="10" fill="#8a94a0">FR-EQP-04</text>

  <!-- yes -> down to L1 box (request) -->
  <path d="M430,650 V690 H170 V730" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="250" y="682" font-size="11" fill="#2a7a2a">ใช่</text>
  <rect x="60" y="730" width="220" height="65" rx="8" fill="#ffffff" stroke="#3a5a8a" stroke-width="1.6"/>
  <text x="170" y="755" text-anchor="middle" font-size="12">กรอกข้อมูลกิจกรรมและ</text>
  <text x="170" y="773" text-anchor="middle" font-size="12">ส่งคำขออนุมัติ (UC-04)</text>

  <!-- request -> approver -->
  <path d="M280,762 H950 V800" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="840" y="800" width="220" height="65" rx="8" fill="#ffffff" stroke="#6a3a8a" stroke-width="1.6"/>
  <text x="950" y="825" text-anchor="middle" font-size="12">พิจารณาและบันทึก</text>
  <text x="950" y="843" text-anchor="middle" font-size="12">ผลการอนุมัติ</text>

  <line x1="950" y1="865" x2="950" y2="905" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- decision approved? -->
  <polygon points="950,905 1030,965 950,1025 870,965" fill="#fff7e6" stroke="#c9711a" stroke-width="1.6"/>
  <text x="950" y="960" text-anchor="middle" font-size="11">อนุมัติหรือไม่?</text>

  <!-- not approved -> reject -->
  <path d="M870,965 H600" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="955" font-size="11" fill="#a04a0a">ไม่อนุมัติ</text>
  <rect x="380" y="935" width="220" height="60" rx="8" fill="#ffffff" stroke="#8a2a2a" stroke-width="1.6"/>
  <text x="490" y="960" text-anchor="middle" font-size="12">แจ้งผลปฏิเสธคำขอ</text>
  <text x="490" y="978" text-anchor="middle" font-size="12">ให้ผู้ยืมทราบ</text>
  <line x1="490" y1="995" x2="490" y2="1025" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="490" cy="1042" r="14" fill="none" stroke="#8a2a2a" stroke-width="2.2"/>
  <circle cx="490" cy="1042" r="8" fill="#8a2a2a"/>

  <!-- approved -> merge down -->
  <path d="M950,1025 V1080 H430 V1110" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="960" y="1055" font-size="11" fill="#2a7a2a">อนุมัติ</text>

  <!-- no (not special) -> skip detour, straight to merge -->
  <path d="M510,590 H1160 V1080 H430" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="1000" y="580" font-size="11" fill="#a04a0a">ไม่ใช่ (ปกติ)</text>

  <!-- merge dot -->
  <circle cx="430" cy="1080" r="5" fill="#3a4a5a"/>

  <!-- 6. box L1 confirm booking -->
  <rect x="60" y="1110" width="220" height="55" rx="8" fill="#ffffff" stroke="#3a5a8a" stroke-width="1.6"/>
  <text x="170" y="1143" text-anchor="middle" font-size="12.5">ยืนยันการจอง</text>

  <path d="M280,1137 H430 V1170" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- 7. box L2: no-overlap check + save booking -->
  <rect x="320" y="1170" width="220" height="65" rx="8" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.6"/>
  <text x="430" y="1195" text-anchor="middle" font-size="12">ตรวจสอบไม่ให้ทับซ้อนอีกครั้ง</text>
  <text x="430" y="1213" text-anchor="middle" font-size="12">และบันทึกรายการจอง (UC-07)</text>
  <text x="430" y="1228" text-anchor="middle" font-size="10" fill="#8a94a0">FR-EQP-07</text>

  <path d="M540,1202 H690 V1270" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- 8. box L3: condition before + handover -->
  <rect x="580" y="1270" width="220" height="70" rx="8" fill="#fdf3e2" stroke="#a86a1a" stroke-width="1.6"/>
  <text x="690" y="1293" text-anchor="middle" font-size="12">ตรวจสภาพ บันทึกภาพถ่าย</text>
  <text x="690" y="1311" text-anchor="middle" font-size="12">ก่อนส่งมอบ และส่งมอบอุปกรณ์</text>
  <text x="690" y="1329" text-anchor="middle" font-size="10" fill="#8a94a0">UC-02 · FR-EQP-02</text>

  <line x1="690" y1="1340" x2="690" y2="1380" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 9. diamond L3: early recall needed? -->
  <polygon points="690,1380 775,1440 690,1500 605,1440" fill="#fff7e6" stroke="#c9711a" stroke-width="1.6"/>
  <text x="690" y="1435" text-anchor="middle" font-size="11">จำเป็นต้องเรียกคืน</text>
  <text x="690" y="1449" text-anchor="middle" font-size="11">ก่อนกำหนดหรือไม่?</text>

  <!-- yes -> recall -->
  <path d="M690,1500 V1540" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="705" y="1525" font-size="11" fill="#2a7a2a">ใช่ (เร่งด่วน)</text>
  <rect x="580" y="1540" width="220" height="65" rx="8" fill="#fdf3e2" stroke="#a86a1a" stroke-width="1.6"/>
  <text x="690" y="1564" text-anchor="middle" font-size="12">เรียกคืนอุปกรณ์ก่อนกำหนด</text>
  <text x="690" y="1582" text-anchor="middle" font-size="12">พร้อมระบุเหตุผล (UC-05)</text>
  <text x="690" y="1597" text-anchor="middle" font-size="10" fill="#8a94a0">FR-EQP-05</text>

  <path d="M800,1572 H430 V1640" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="320" y="1640" width="220" height="55" rx="8" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.6"/>
  <text x="430" y="1673" text-anchor="middle" font-size="12.5">แจ้งผู้ยืมทราบเหตุผล</text>

  <path d="M430,1695 V1730 H430" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- no -> straight to return, long path -->
  <path d="M775,1440 H1000 V1750 H280" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="880" y="1430" font-size="11" fill="#a04a0a">ไม่ใช่ (ปกติ)</text>

  <!-- merge dot before return -->
  <circle cx="430" cy="1750" r="5" fill="#3a4a5a"/>

  <!-- 10. box L1: return equipment -->
  <rect x="60" y="1750" width="220" height="55" rx="8" fill="#ffffff" stroke="#3a5a8a" stroke-width="1.6"/>
  <text x="170" y="1783" text-anchor="middle" font-size="12.5">นำอุปกรณ์มาคืน</text>

  <path d="M280,1777 H690 V1815" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- 11. box L3: condition after return -->
  <rect x="580" y="1815" width="220" height="65" rx="8" fill="#fdf3e2" stroke="#a86a1a" stroke-width="1.6"/>
  <text x="690" y="1840" text-anchor="middle" font-size="12">ตรวจสภาพและบันทึกภาพถ่าย</text>
  <text x="690" y="1858" text-anchor="middle" font-size="12">หลังรับคืน (UC-02)</text>
  <text x="690" y="1872" text-anchor="middle" font-size="10" fill="#8a94a0">FR-EQP-02</text>

  <path d="M580,1847 H430 V1885" stroke="#3a4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- 12. box L2: record into history -->
  <rect x="320" y="1885" width="220" height="60" rx="8" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.6"/>
  <text x="430" y="1908" text-anchor="middle" font-size="12">บันทึกรายการลงในประวัติ</text>
  <text x="430" y="1926" text-anchor="middle" font-size="12">การยืม–คืน (UC-01)</text>

  <line x1="430" y1="1945" x2="430" y2="1975" stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="430" cy="1985" r="16" fill="none" stroke="#0f2a4a" stroke-width="2.4"/>
  <circle cx="430" cy="1985" r="9" fill="#0f2a4a"/>

</svg>
