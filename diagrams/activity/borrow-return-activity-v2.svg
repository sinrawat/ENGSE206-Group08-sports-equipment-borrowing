<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1300" font-family="'Segoe UI','Noto Sans Thai',Tahoma,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f2a4a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="1300" fill="#ffffff"/>
  <text x="520" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f2a4a">Activity Diagram — เพิ่ม/ดูอุปกรณ์ → ยืม → คืน → ดูข้อมูลสรุป (v2)</text>
  <text x="520" y="56" text-anchor="middle" font-size="12.5" fill="#4a5a6a">ระบบยืม–คืนอุปกรณ์กีฬาและกิจกรรม (Case 08) · ขอบเขตแบบง่าย</text>

  <!-- swimlanes -->
  <g stroke="#0f2a4a" stroke-width="1.6" fill="none">
    <line x1="20" y1="90" x2="20" y2="1270"/>
    <line x1="270" y1="90" x2="270" y2="1270"/>
    <line x1="560" y1="90" x2="560" y2="1270"/>
    <line x1="810" y1="90" x2="810" y2="1270"/>
    <line x1="1020" y1="90" x2="1020" y2="1270"/>
    <line x1="20" y1="90" x2="1020" y2="90"/>
  </g>
  <g fill="#eaf2fb">
    <rect x="20" y="90" width="250" height="34"/>
    <rect x="270" y="90" width="290" height="34"/>
    <rect x="560" y="90" width="250" height="34"/>
    <rect x="810" y="90" width="210" height="34"/>
  </g>
  <g stroke="#0f2a4a" stroke-width="1.6" fill="none">
    <line x1="20" y1="124" x2="1020" y2="124"/>
  </g>
  <text x="145" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0f2a4a">ผู้ดูแลอุปกรณ์</text>
  <text x="415" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0f2a4a">ผู้ยืม / ชมรม-ผู้จัดกิจกรรม</text>
  <text x="685" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0f2a4a">ระบบ</text>
  <text x="915" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0f2a4a">เจ้าหน้าที่/ผู้บริหาร</text>

  <!-- start node -->
  <circle cx="145" cy="160" r="12" fill="#0f2a4a"/>

  <!-- Step 1: custodian adds equipment (lane1) -->
  <rect x="55" y="190" width="180" height="60" rx="10" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
  <text x="145" y="215" text-anchor="middle" font-size="12.5" fill="#0f2a4a">เพิ่มรายการอุปกรณ์ใหม่</text>
  <text x="145" y="233" text-anchor="middle" font-size="11" fill="#3a4a5a">(UC-01)</text>

  <!-- arrow lane1 -> lane3 (record) -->
  <path d="M235,220 L685,220" stroke="#0f2a4a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="595" y="190" width="180" height="60" rx="10" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
  <text x="685" y="215" text-anchor="middle" font-size="12.5" fill="#0f2a4a">บันทึกอุปกรณ์เข้าระบบ</text>
  <text x="685" y="233" text-anchor="middle" font-size="11" fill="#3a4a5a">สถานะ = "ว่าง"</text>

  <!-- arrow lane3 -> lane2 (view list) -->
  <path d="M685,250 L685,320 L415,320" stroke="#0f2a4a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="325" y="330" width="180" height="60" rx="10" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
  <text x="415" y="355" text-anchor="middle" font-size="12.5" fill="#0f2a4a">ดูรายการอุปกรณ์ที่มี</text>
  <text x="415" y="373" text-anchor="middle" font-size="11" fill="#3a4a5a">(UC-02)</text>

  <!-- arrow to select+confirm borrow -->
  <path d="M415,390 L415,450" stroke="#0f2a4a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="325" y="460" width="180" height="60" rx="10" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
  <text x="415" y="485" text-anchor="middle" font-size="12.5" fill="#0f2a4a">เลือกอุปกรณ์และยืนยันยืม</text>
  <text x="415" y="503" text-anchor="middle" font-size="11" fill="#3a4a5a">(UC-03)</text>

  <!-- arrow lane2 -> lane3 decision -->
  <path d="M505,490 L685,490 L685,540" stroke="#0f2a4a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <polygon points="685,540 745,590 685,640 625,590" fill="#fbeee0" stroke="#c9711a" stroke-width="1.8"/>
  <text x="685" y="585" text-anchor="middle" font-size="12" fill="#7a4a10">อุปกรณ์</text>
  <text x="685" y="600" text-anchor="middle" font-size="12" fill="#7a4a10">ว่างหรือไม่?</text>

  <!-- No -> back to view list -->
  <path d="M625,590 L415,590 L415,390" stroke="#c9711a" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="583" text-anchor="middle" font-size="11" fill="#c9711a" font-style="italic">ไม่ว่าง</text>

  <!-- Yes -> record borrow -->
  <path d="M685,640 L685,690" stroke="#0f2a4a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="710" y="665" font-size="11" fill="#1f7a7a" font-style="italic">ว่าง</text>
  <rect x="595" y="700" width="180" height="60" rx="10" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
  <text x="685" y="723" text-anchor="middle" font-size="12" fill="#0f2a4a">บันทึกการยืม</text>
  <text x="685" y="741" text-anchor="middle" font-size="11" fill="#3a4a5a">สถานะ = "ถูกยืม"</text>

  <!-- arrow lane3 -> lane2 (use equipment) -->
  <path d="M595,730 L415,730 L415,790" stroke="#0f2a4a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="325" y="800" width="180" height="60" rx="10" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
  <text x="415" y="825" text-anchor="middle" font-size="12.5" fill="#0f2a4a">ใช้งานอุปกรณ์</text>
  <text x="415" y="843" text-anchor="middle" font-size="11" fill="#3a4a5a">แล้วนำมาคืน</text>

  <!-- arrow lane2 -> lane1 (custodian confirms return) -->
  <path d="M325,830 L145,830 L145,900" stroke="#0f2a4a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="55" y="910" width="180" height="60" rx="10" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
  <text x="145" y="933" text-anchor="middle" font-size="12" fill="#0f2a4a">ตรวจสอบและยืนยัน</text>
  <text x="145" y="951" text-anchor="middle" font-size="12" fill="#0f2a4a">รับคืน (UC-04)</text>

  <!-- arrow lane1 -> lane3 (record return) -->
  <path d="M235,940 L685,940 L685,990" stroke="#0f2a4a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="595" y="1000" width="180" height="70" rx="10" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
  <text x="685" y="1023" text-anchor="middle" font-size="12" fill="#0f2a4a">บันทึกการคืน</text>
  <text x="685" y="1040" text-anchor="middle" font-size="11" fill="#3a4a5a">สถานะ = "ว่าง"</text>
  <text x="685" y="1057" text-anchor="middle" font-size="11" fill="#3a4a5a">อัปเดตข้อมูลการใช้งาน</text>

  <!-- arrow lane3 -> lane4 (view summary) -->
  <path d="M775,1035 L915,1035 L915,1090" stroke="#0f2a4a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="825" y="1100" width="180" height="60" rx="10" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
  <text x="915" y="1125" text-anchor="middle" font-size="12" fill="#0f2a4a">ดูข้อมูลสรุป</text>
  <text x="915" y="1143" text-anchor="middle" font-size="12" fill="#0f2a4a">การใช้งาน (UC-05)</text>

  <!-- end node -->
  <path d="M915,1160 L915,1200" stroke="#0f2a4a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <circle cx="915" cy="1215" r="12" fill="none" stroke="#0f2a4a" stroke-width="2.5"/>
  <circle cx="915" cy="1215" r="6" fill="#0f2a4a"/>

  <rect x="55" y="1240" width="930" height="34" rx="6" fill="#fbeee0" stroke="#c9711a" stroke-width="1"/>
  <text x="520" y="1262" text-anchor="middle" font-size="10.5" fill="#7a4a10">v2 — ตัดขอบเขตเดิม (คำขออนุมัติพิเศษ, จองล่วงหน้า, เรียกคืนก่อนกำหนด, ดูหลักฐานแยก) ออก เหลือเฉพาะ flow หลัก</text>
</svg>
