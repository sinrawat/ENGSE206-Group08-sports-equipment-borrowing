<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="'Segoe UI','Noto Sans Thai',Tahoma,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1100" height="680" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f2a4a">Domain Model — ระบบยืม–คืนอุปกรณ์กีฬาและกิจกรรม (v2)</text>
  <text x="550" y="56" text-anchor="middle" font-size="12.5" fill="#4a5a6a">Conceptual class diagram · ขอบเขตแบบง่าย (ตัด Booking / Approval ออก)</text>

  <!-- ผู้ใช้งาน (User) -->
  <g>
    <rect x="60" y="120" width="230" height="140" rx="8" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <rect x="60" y="120" width="230" height="34" fill="#1f7a7a"/>
    <text x="175" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ผู้ใช้งาน (User)</text>
    <line x1="60" y1="154" x2="290" y2="154" stroke="#1f7a7a" stroke-width="1"/>
    <text x="72" y="176" font-size="11.5" fill="#1a2a3a">- userId</text>
    <text x="72" y="194" font-size="11.5" fill="#1a2a3a">- name</text>
    <text x="72" y="212" font-size="11.5" fill="#1a2a3a">- role: ผู้ดูแลอุปกรณ์ / ผู้ยืม /</text>
    <text x="82" y="228" font-size="11.5" fill="#1a2a3a">  ชมรม-ผู้จัดกิจกรรม / เจ้าหน้าที่-ผู้บริหาร</text>
  </g>

  <!-- อุปกรณ์ (Equipment) -->
  <g>
    <rect x="430" y="60" width="230" height="140" rx="8" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <rect x="430" y="60" width="230" height="34" fill="#1f7a7a"/>
    <text x="545" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">อุปกรณ์ (Equipment)</text>
    <line x1="430" y1="94" x2="660" y2="94" stroke="#1f7a7a" stroke-width="1"/>
    <text x="442" y="116" font-size="11.5" fill="#1a2a3a">- equipmentId</text>
    <text x="442" y="134" font-size="11.5" fill="#1a2a3a">- name</text>
    <text x="442" y="152" font-size="11.5" fill="#1a2a3a">- category</text>
    <text x="442" y="170" font-size="11.5" fill="#1a2a3a">- status: ว่าง / ถูกยืม</text>
    <text x="442" y="188" font-size="11.5" fill="#1a2a3a">+ addEquipment()</text>
  </g>

  <!-- รายการยืม-คืน (BorrowRecord) -->
  <g>
    <rect x="430" y="300" width="250" height="160" rx="8" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <rect x="430" y="300" width="250" height="34" fill="#1f7a7a"/>
    <text x="555" y="323" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">รายการยืม–คืน (BorrowRecord)</text>
    <line x1="430" y1="334" x2="680" y2="334" stroke="#1f7a7a" stroke-width="1"/>
    <text x="442" y="356" font-size="11.5" fill="#1a2a3a">- recordId</text>
    <text x="442" y="374" font-size="11.5" fill="#1a2a3a">- borrowDate</text>
    <text x="442" y="392" font-size="11.5" fill="#1a2a3a">- returnDate</text>
    <text x="442" y="410" font-size="11.5" fill="#1a2a3a">- status: ถูกยืม / คืนแล้ว</text>
    <text x="442" y="428" font-size="11.5" fill="#1a2a3a">+ borrow()</text>
    <text x="442" y="446" font-size="11.5" fill="#1a2a3a">+ returnItem()</text>
  </g>

  <!-- ข้อมูลสรุปการใช้งาน (UsageSummary) -->
  <g>
    <rect x="820" y="330" width="230" height="110" rx="8" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <rect x="820" y="330" width="230" height="34" fill="#1f7a7a"/>
    <text x="935" y="353" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">ข้อมูลสรุปการใช้งาน</text>
    <line x1="820" y1="364" x2="1050" y2="364" stroke="#1f7a7a" stroke-width="1"/>
    <text x="832" y="386" font-size="11.5" fill="#1a2a3a">- equipmentId</text>
    <text x="832" y="404" font-size="11.5" fill="#1a2a3a">- borrowCount</text>
    <text x="832" y="422" font-size="11.5" fill="#1a2a3a">+ generateSummary()</text>
  </g>

  <!-- relationships -->
  <g stroke="#0f2a4a" stroke-width="1.6" fill="none">
    <!-- User -> Equipment (custodian adds) -->
    <path d="M290,180 C 360,150 380,130 430,130"/>
    <!-- User -> BorrowRecord (borrower makes) -->
    <path d="M290,220 C 360,300 380,350 430,370"/>
    <!-- Equipment -> BorrowRecord -->
    <line x1="555" y1="200" x2="555" y2="300"/>
    <!-- BorrowRecord -> UsageSummary -->
    <path d="M680,400 C 750,390 780,385 820,385"/>
  </g>
  <g font-size="11" fill="#5a6a7a">
    <text x="300" y="165">1</text>
    <text x="418" y="128">0..*</text>
    <text x="300" y="255">1</text>
    <text x="418" y="368">0..*</text>
    <text x="562" y="215">1</text>
    <text x="562" y="292">0..*</text>
    <text x="690" y="392">0..*</text>
    <text x="808" y="380">1</text>
  </g>
  <g font-size="11.5" fill="#7a4a10" font-style="italic">
    <text x="320" y="140">เพิ่ม/ดูแล</text>
    <text x="320" y="330">ยืม</text>
    <text x="570" y="255">ถูกยืมใน</text>
    <text x="700" y="415">รวมเป็น</text>
  </g>

  <rect x="60" y="500" width="990" height="60" rx="8" fill="#fbeee0" stroke="#c9711a" stroke-width="1"/>
  <text x="555" y="524" text-anchor="middle" font-size="11.5" fill="#7a4a10">v2 — ตัด class BookingRequest / ApprovalRequest / ConditionEvidence ออก เพราะตัดขอบเขตจองล่วงหน้า/อนุมัติพิเศษ/หลักฐานสภาพแยก</text>
  <text x="555" y="544" text-anchor="middle" font-size="11.5" fill="#7a4a10">เหลือเฉพาะ entity หลักที่รองรับ flow: เพิ่ม/ดูอุปกรณ์ → ยืม → คืน → สรุปการใช้งาน</text>

  <text x="550" y="650" text-anchor="middle" font-size="11" fill="#7a8a9a">อ้างอิง: docs/06-requirement-models.md §5.3 (v2)</text>
</svg>
