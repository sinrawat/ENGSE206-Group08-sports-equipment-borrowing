<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="'Segoe UI','Noto Sans Thai',Tahoma,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="incArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c9711a"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1000" height="800" fill="#ffffff"/>

  <!-- title -->
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f2a4a">Use Case Diagram — ระบบยืม–คืนอุปกรณ์กีฬาและกิจกรรม (Case 08)</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#4a5a6a">4 actors · 8 use cases (UC-01–UC-08) · association ล้วน + 1 include · อ้างอิง docs/06-requirement-models.md</text>

  <!-- system boundary -->
  <rect x="200" y="90" width="600" height="650" rx="10" fill="#f4fbfb" stroke="#0f2a4a" stroke-width="2.5"/>
  <text x="500" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#0f2a4a">ระบบยืม–คืนอุปกรณ์กีฬาและกิจกรรม</text>

  <!-- ===== actors ===== -->
  <!-- actor symbol template drawn inline per actor -->

  <!-- ผู้ยืม (top-left) -->
  <g transform="translate(75,190)">
    <circle cx="0" cy="-42" r="11" fill="none" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="0" y1="-31" x2="0" y2="12" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="-16" y1="-16" x2="16" y2="-16" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="0" y1="12" x2="-16" y2="38" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="0" y1="12" x2="16" y2="38" stroke="#0f2a4a" stroke-width="2.5"/>
    <text x="0" y="60" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f2a4a">ผู้ยืม</text>
    <text x="0" y="76" text-anchor="middle" font-size="10.5" fill="#5a6a7a">(Borrower)</text>
  </g>

  <!-- ชมรม/ผู้จัดกิจกรรม (bottom-left) -->
  <g transform="translate(75,570)">
    <circle cx="0" cy="-42" r="11" fill="none" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="0" y1="-31" x2="0" y2="12" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="-16" y1="-16" x2="16" y2="-16" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="0" y1="12" x2="-16" y2="38" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="0" y1="12" x2="16" y2="38" stroke="#0f2a4a" stroke-width="2.5"/>
    <text x="0" y="60" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f2a4a">ชมรม /</text>
    <text x="0" y="76" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f2a4a">ผู้จัดกิจกรรม</text>
    <text x="0" y="92" text-anchor="middle" font-size="10.5" fill="#5a6a7a">(Club / Organizer)</text>
  </g>

  <!-- ผู้ดูแลอุปกรณ์ (top-right) -->
  <g transform="translate(925,190)">
    <circle cx="0" cy="-42" r="11" fill="none" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="0" y1="-31" x2="0" y2="12" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="-16" y1="-16" x2="16" y2="-16" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="0" y1="12" x2="-16" y2="38" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="0" y1="12" x2="16" y2="38" stroke="#0f2a4a" stroke-width="2.5"/>
    <text x="0" y="60" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f2a4a">ผู้ดูแลอุปกรณ์</text>
    <text x="0" y="76" text-anchor="middle" font-size="10.5" fill="#5a6a7a">(Equipment Custodian)</text>
  </g>

  <!-- เจ้าหน้าที่/ผู้บริหาร (bottom-right) -->
  <g transform="translate(925,570)">
    <circle cx="0" cy="-42" r="11" fill="none" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="0" y1="-31" x2="0" y2="12" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="-16" y1="-16" x2="16" y2="-16" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="0" y1="12" x2="-16" y2="38" stroke="#0f2a4a" stroke-width="2.5"/>
    <line x1="0" y1="12" x2="16" y2="38" stroke="#0f2a4a" stroke-width="2.5"/>
    <text x="0" y="60" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f2a4a">เจ้าหน้าที่ /</text>
    <text x="0" y="76" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f2a4a">ผู้บริหาร</text>
    <text x="0" y="92" text-anchor="middle" font-size="10.5" fill="#5a6a7a">(Staff / Admin)</text>
  </g>

  <!-- ===== association lines (drawn under ellipses) ===== -->
  <g stroke="#5a6a7a" stroke-width="1.6">
    <line x1="120" y1="185" x2="240" y2="170"/> <!-- borrower -> UC-03 -->
    <line x1="120" y1="200" x2="240" y2="310"/> <!-- borrower -> UC-04 -->
    <line x1="120" y1="555" x2="240" y2="450"/> <!-- club -> UC-06 -->
    <line x1="120" y1="575" x2="240" y2="590"/> <!-- club -> UC-07 -->
    <line x1="880" y1="185" x2="760" y2="170"/> <!-- custodian -> UC-01 -->
    <line x1="880" y1="195" x2="760" y2="310"/> <!-- custodian -> UC-02 -->
    <line x1="880" y1="210" x2="760" y2="450"/> <!-- custodian -> UC-05 -->
    <line x1="880" y1="565" x2="760" y2="590"/> <!-- staff -> UC-08 -->
  </g>

  <!-- include relationship: UC-07 -> UC-06 -->
  <line x1="330" y1="552" x2="330" y2="488" stroke="#c9711a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#incArrow)"/>
  <text x="345" y="524" font-size="11.5" fill="#c9711a" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- ===== use case ellipses: column A (x=330) ===== -->
  <g font-size="12.5">
    <ellipse cx="330" cy="170" rx="100" ry="40" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <text x="330" y="164" text-anchor="middle" font-weight="700" fill="#0f2a4a">UC-03</text>
    <text x="330" y="180" text-anchor="middle" fill="#1a2a3a">ตรวจสอบหลักฐาน</text>
    <text x="330" y="195" text-anchor="middle" fill="#1a2a3a">สภาพอุปกรณ์</text>

    <ellipse cx="330" cy="310" rx="100" ry="40" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <text x="330" y="300" text-anchor="middle" font-weight="700" fill="#0f2a4a">UC-04</text>
    <text x="330" y="316" text-anchor="middle" fill="#1a2a3a">ส่งคำขอยืมอุปกรณ์</text>
    <text x="330" y="331" text-anchor="middle" fill="#1a2a3a">ประเภทพิเศษ</text>

    <ellipse cx="330" cy="450" rx="100" ry="40" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <text x="330" y="440" text-anchor="middle" font-weight="700" fill="#0f2a4a">UC-06</text>
    <text x="330" y="456" text-anchor="middle" fill="#1a2a3a">ตรวจสอบสถานะและ</text>
    <text x="330" y="471" text-anchor="middle" fill="#1a2a3a">ความพร้อมของอุปกรณ์</text>

    <ellipse cx="330" cy="590" rx="100" ry="40" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <text x="330" y="584" text-anchor="middle" font-weight="700" fill="#0f2a4a">UC-07</text>
    <text x="330" y="600" text-anchor="middle" fill="#1a2a3a">จองอุปกรณ์ล่วงหน้า</text>
  </g>

  <!-- ===== use case ellipses: column B (x=670) ===== -->
  <g font-size="12.5">
    <ellipse cx="670" cy="170" rx="100" ry="40" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <text x="670" y="160" text-anchor="middle" font-weight="700" fill="#0f2a4a">UC-01</text>
    <text x="670" y="176" text-anchor="middle" fill="#1a2a3a">จัดการประวัติการยืม–</text>
    <text x="670" y="191" text-anchor="middle" fill="#1a2a3a">คืนอุปกรณ์</text>

    <ellipse cx="670" cy="310" rx="100" ry="40" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <text x="670" y="300" text-anchor="middle" font-weight="700" fill="#0f2a4a">UC-02</text>
    <text x="670" y="316" text-anchor="middle" fill="#1a2a3a">บันทึกสภาพอุปกรณ์</text>
    <text x="670" y="331" text-anchor="middle" fill="#1a2a3a">ก่อน–หลังการยืม</text>

    <ellipse cx="670" cy="450" rx="100" ry="40" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <text x="670" y="444" text-anchor="middle" font-weight="700" fill="#0f2a4a">UC-05</text>
    <text x="670" y="460" text-anchor="middle" fill="#1a2a3a">เรียกคืนอุปกรณ์</text>
    <text x="670" y="475" text-anchor="middle" fill="#1a2a3a">ก่อนกำหนด</text>

    <ellipse cx="670" cy="590" rx="100" ry="40" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <text x="670" y="580" text-anchor="middle" font-weight="700" fill="#0f2a4a">UC-08</text>
    <text x="670" y="596" text-anchor="middle" fill="#1a2a3a">ดูข้อมูลสรุปการใช้งาน</text>
    <text x="670" y="611" text-anchor="middle" fill="#1a2a3a">อุปกรณ์</text>
  </g>

  <!-- footnote -->
  <rect x="200" y="668" width="600" height="55" rx="6" fill="#fbeee0" stroke="#c9711a" stroke-width="1"/>
  <text x="500" y="689" text-anchor="middle" font-size="11.5" fill="#7a4a10">Core = actor + boundary + use case เท่านั้น · ไม่ใช้ include/extend พร่ำเพรื่อ</text>
  <text x="500" y="706" text-anchor="middle" font-size="11.5" fill="#7a4a10">Secondary actor (ผู้อนุมัติ/ผู้รับแจ้งเตือน) ระบุไว้ใน Use Case Specification แทนการวาดซ้ำ</text>

  <text x="500" y="770" text-anchor="middle" font-size="11" fill="#8a94a0">อ้างอิง: docs/06-requirement-models.md §3–4 · Requirement backlog: docs/05-requirement-backlog-v0.2.md</text>
</svg>
