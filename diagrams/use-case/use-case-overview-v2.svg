<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="'Segoe UI','Noto Sans Thai',Tahoma,sans-serif">
  <rect x="0" y="0" width="1400" height="1050" fill="#ffffff"/>
  <text x="700" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f2a4a">Use Case Diagram — ระบบยืม–คืนอุปกรณ์กีฬาและกิจกรรม (Case 08) — v2</text>
  <text x="700" y="68" text-anchor="middle" font-size="14" fill="#4a5a6a">4 actors · 5 use cases (UC-01–UC-05, ขอบเขตใหม่แบบง่าย) · อ้างอิง docs/06-requirement-models-v2.md</text>

  <!-- system boundary -->
  <rect x="330" y="100" width="740" height="860" rx="12" fill="#f4fbfb" stroke="#0f2a4a" stroke-width="2.4"/>
  <text x="700" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#0f2a4a">ระบบยืม–คืนอุปกรณ์กีฬาและกิจกรรม</text>

  <!-- actors -->
  <g id="actors">
    <!-- ผู้ยืม top-left -->
    <g transform="translate(110,300)">
      <circle cx="0" cy="-42" r="13" fill="none" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="0" y1="-29" x2="0" y2="18" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="-18" y1="-12" x2="18" y2="-12" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="0" y1="18" x2="-18" y2="46" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="0" y1="18" x2="18" y2="46" stroke="#0f2a4a" stroke-width="2.8"/>
      <text x="0" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#0f2a4a">ผู้ยืม</text>
      <text x="0" y="90" text-anchor="middle" font-size="11" fill="#5a6a7a">(Borrower)</text>
    </g>

    <!-- ผู้ดูแลอุปกรณ์ top-right -->
    <g transform="translate(1290,260)">
      <circle cx="0" cy="-42" r="13" fill="none" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="0" y1="-29" x2="0" y2="18" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="-18" y1="-12" x2="18" y2="-12" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="0" y1="18" x2="-18" y2="46" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="0" y1="18" x2="18" y2="46" stroke="#0f2a4a" stroke-width="2.8"/>
      <text x="0" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#0f2a4a">ผู้ดูแลอุปกรณ์</text>
      <text x="0" y="90" text-anchor="middle" font-size="11" fill="#5a6a7a">(Equipment Custodian)</text>
    </g>

    <!-- ชมรม/ผู้จัดกิจกรรม bottom-left -->
    <g transform="translate(110,760)">
      <circle cx="0" cy="-42" r="13" fill="none" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="0" y1="-29" x2="0" y2="18" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="-18" y1="-12" x2="18" y2="-12" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="0" y1="18" x2="-18" y2="46" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="0" y1="18" x2="18" y2="46" stroke="#0f2a4a" stroke-width="2.8"/>
      <text x="0" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#0f2a4a">ชมรม /</text>
      <text x="0" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#0f2a4a">ผู้จัดกิจกรรม</text>
      <text x="0" y="108" text-anchor="middle" font-size="11" fill="#5a6a7a">(Club / Organizer)</text>
    </g>

    <!-- เจ้าหน้าที่/ผู้บริหาร bottom-right -->
    <g transform="translate(1290,760)">
      <circle cx="0" cy="-42" r="13" fill="none" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="0" y1="-29" x2="0" y2="18" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="-18" y1="-12" x2="18" y2="-12" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="0" y1="18" x2="-18" y2="46" stroke="#0f2a4a" stroke-width="2.8"/>
      <line x1="0" y1="18" x2="18" y2="46" stroke="#0f2a4a" stroke-width="2.8"/>
      <text x="0" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#0f2a4a">เจ้าหน้าที่ /</text>
      <text x="0" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#0f2a4a">ผู้บริหาร</text>
      <text x="0" y="108" text-anchor="middle" font-size="11" fill="#5a6a7a">(Staff / Admin)</text>
    </g>
  </g>

  <!-- associations (drawn before ellipses so ellipse fill covers line ends) -->
  <g stroke="#5a6a7a" stroke-width="1.6">
    <!-- ผู้ยืม (110,300) -> UC-02,03,04 -->
    <line x1="150" y1="300" x2="560" y2="340"/>
    <line x1="150" y1="300" x2="560" y2="480"/>
    <line x1="150" y1="300" x2="560" y2="620"/>
    <!-- ผู้ดูแลอุปกรณ์ (1290,260) -> UC-01,02,04 -->
    <line x1="1250" y1="260" x2="840" y2="200"/>
    <line x1="1250" y1="260" x2="840" y2="340"/>
    <line x1="1250" y1="260" x2="840" y2="620"/>
    <!-- ชมรม/ผู้จัดกิจกรรม (110,760) -> UC-02,03,04 -->
    <line x1="150" y1="760" x2="560" y2="340"/>
    <line x1="150" y1="760" x2="560" y2="480"/>
    <line x1="150" y1="760" x2="560" y2="620"/>
    <!-- เจ้าหน้าที่/ผู้บริหาร (1290,760) -> UC-05 -->
    <line x1="1250" y1="760" x2="840" y2="760"/>
  </g>

  <!-- use cases -->
  <g>
    <ellipse cx="700" cy="200" rx="145" ry="48" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <text x="700" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#0f2a4a">UC-01</text>
    <text x="700" y="211" text-anchor="middle" font-size="12.5" fill="#1a2a3a">เพิ่มรายการอุปกรณ์</text>

    <ellipse cx="700" cy="340" rx="145" ry="48" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <text x="700" y="333" text-anchor="middle" font-size="14" font-weight="700" fill="#0f2a4a">UC-02</text>
    <text x="700" y="351" text-anchor="middle" font-size="12.5" fill="#1a2a3a">ดูรายการอุปกรณ์</text>

    <ellipse cx="700" cy="480" rx="145" ry="48" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <text x="700" y="473" text-anchor="middle" font-size="14" font-weight="700" fill="#0f2a4a">UC-03</text>
    <text x="700" y="491" text-anchor="middle" font-size="12.5" fill="#1a2a3a">ยืมอุปกรณ์</text>

    <ellipse cx="700" cy="620" rx="145" ry="48" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <text x="700" y="613" text-anchor="middle" font-size="14" font-weight="700" fill="#0f2a4a">UC-04</text>
    <text x="700" y="631" text-anchor="middle" font-size="12.5" fill="#1a2a3a">คืนอุปกรณ์</text>

    <ellipse cx="700" cy="760" rx="145" ry="48" fill="#eaf6f6" stroke="#1f7a7a" stroke-width="1.8"/>
    <text x="700" y="753" text-anchor="middle" font-size="14" font-weight="700" fill="#0f2a4a">UC-05</text>
    <text x="700" y="771" text-anchor="middle" font-size="12" fill="#1a2a3a">ดูข้อมูลสรุปการใช้งาน</text>
  </g>

  <text x="700" y="1020" text-anchor="middle" font-size="11.5" fill="#7a8a9a">อ้างอิง: docs/06-requirement-models-v2.md §3–4 (v2 — ขอบเขตแบบง่าย, แยก UC เพิ่ม/ดูออกจากกัน)</text>
</svg>
